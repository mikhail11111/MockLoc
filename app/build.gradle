// Release signing key (release.keystore) + passwords in ~/.gradle/gradle.properties
// stay on the build machine and are gitignored. Without them the release build
// stays unsigned (app-release-unsigned.apk).
def releaseKs = rootProject.file("release.keystore")
def releaseStorePass = findProperty("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = findProperty("RELEASE_KEY_ALIAS") ?: "mocklocation"
def releaseKeyPass = findProperty("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseKs.exists() && releaseStorePass != null && releaseKeyPass != null

android {
    namespace = "com.mockloc.app"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.mockloc.app"
        minSdk = 26
        targetSdk = 34
        versionCode = 3
        versionName = "1.3"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKs
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

